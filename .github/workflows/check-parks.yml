name: Check Park Alerts

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: park-check
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    container: swift:6.1
    outputs:
      site-changed: ${{ steps.site-cache.outputs.cache-hit != 'true' }}
      site-key: ${{ steps.site-cache.outputs.cache-primary-key }}
    steps:
      - uses: actions/checkout@v7

      - name: Restore cached binary
        id: binary-cache
        uses: actions/cache@v6
        with:
          path: .build/release/EstadoParques
          key: binary-linux-${{ hashFiles('Sources/**', 'Package.swift', 'Package.resolved') }}

      - name: Restore SPM build cache
        if: steps.binary-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-linux-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-linux-

      - name: Build
        if: steps.binary-cache.outputs.cache-hit != 'true'
        run: swift build -c release

      - name: Run park check
        env:
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          PRODUCTION: ${{ vars.PRODUCTION }}
        run: .build/release/EstadoParques

      - name: Generate website
        run: .build/release/EstadoParques --website website

      # The page only changes with the state, the history or a new day: skip redeploying identical output.
      # A marker cached under the site's hash records a deploy; the deploy job saves it only on success.
      - name: Check whether this website was already deployed
        id: site-cache
        uses: actions/cache/restore@v6
        with:
          path: .site-deployed
          key: site-${{ hashFiles('website/**') }}
          lookup-only: true

      - name: Upload website
        if: steps.site-cache.outputs.cache-hit != 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website

      - name: Commit state changes
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add estado_parques.json
          git add estadisticas_parques.ndjson 2>/dev/null || true
          git add estado_api.json 2>/dev/null || true
          git add website/index.html
          git diff --staged --quiet || git commit -m "Update park state $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

  deploy:
    needs: check
    if: needs.check.outputs.site-changed == 'true'
    runs-on: ubuntu-latest
    # Same image as the check job: the cache version depends on the available compressor
    container: swift:6.1
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Mark website as deployed
        run: touch .site-deployed

      - name: Remember deployed website
        uses: actions/cache/save@v6
        with:
          path: .site-deployed
          key: ${{ needs.check.outputs.site-key }}
